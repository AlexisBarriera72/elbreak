<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="El Break Food Truck">
	<!--
		Marca para la pestaña. El logo bueno (el círculo con las palmas, el
		atardecer y el rótulo) es precioso a 160px y una mancha a 16px, que es
		donde de verdad se ve un favicon: no le caben ni las letras.

		Esto es lo mismo contado con cuatro formas — sol, truck, suelo — que
		siguen leyéndose cuando el navegador lo dibuja del tamaño de una uña.
		Mismos colores de la paleta.
	-->
	<defs>
		<clipPath id="c"><rect width="64" height="64" rx="14"/></clipPath>
	</defs>
	<g clip-path="url(#c)">
		<rect width="64" height="64" fill="#0e6e80"/>
		<circle cx="32" cy="27" r="15" fill="#ef6a24"/>
		<rect y="44" width="64" height="20" fill="#ffc24b"/>
		<path d="M12 30h26v14H12zM38 34h8l7 6v4H38z" fill="#fffcf5"/>
		<circle cx="21" cy="45" r="4" fill="#083f4c"/>
		<circle cx="45" cy="45" r="4" fill="#083f4c"/>
	</g>
</svg>
